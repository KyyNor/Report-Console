# 推送 v* 标签即在三平台云端编译，并把安装包自动挂到对应 Release。
# 本地只跑 typecheck/test；selftest/smoke 依赖真实帆软 + MySQL 环境，不在 CI 执行。
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 原生模块架构完全由 install-app-deps --arch 显式控制（package.json 已 npmRebuild:false
          # 且 mac target 不带多架构列表——electron-builder 在 dist 期间自行决定重编架构不可靠，
          # 曾让 arm64 包带上 x86_64 模块 / x64 包带上 arm64 模块，且同配置两次运行结果不同）。
          # mac 双架构拆独立任务，每 arch 一个 runner，node_modules 互不污染
          - os: macos-latest
            dist_cmd: npm run dist -- --mac --arm64 --publish never
            prep_cmd: npx electron-builder install-app-deps --arch arm64
            files: dist/*.dmg
          - os: macos-latest
            dist_cmd: npm run dist -- --mac --x64 --publish never
            prep_cmd: npx electron-builder install-app-deps --arch x64
            files: dist/*.dmg
          - os: windows-latest
            dist_cmd: npm run dist -- --publish never
            prep_cmd: 'true'
            files: dist/*.exe
          - os: ubuntu-latest
            dist_cmd: npm run dist -- --publish never
            prep_cmd: 'true'
            files: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: ${{ matrix.prep_cmd }}
      # CI + v* 标签下 electron-builder 会自动进发布模式要 GH_TOKEN（mac/linux 由此失败），
      # 产物统一由下方 action-gh-release 上传，dist_cmd 里显式关掉它的自动发布
      - run: ${{ matrix.dist_cmd }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
